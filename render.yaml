services:
  - type: web
    name: migraine-detector-api
    runtime: python
    plan: free
    # No rootDir: the build and start commands below are written to work
    # from the repository root, so the service deploys correctly whether or
    # not a Root Directory is set in the dashboard.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/chat/status
    autoDeploy: true
    envVars:
      # Supabase Postgres (IPv4 pooler; the direct db host is IPv6-only).
      # The pooler username is postgres.<project-ref> and the password must
      # be URL-encoded, so "@" becomes "%40".
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: datasets
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_MAX_SENDS
        value: "5"
      # Leave empty. A non-empty value switches Mira into AI mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEVELOPER_EMAILS
        value: developer@migraine.example.com
