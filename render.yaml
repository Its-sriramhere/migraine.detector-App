services:
  - type: web
    name: migraine-detector-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/chat/status
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: migraine-detector-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: datasets
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEVELOPER_EMAILS
        value: developer@migraine.example.com

databases:
  - name: migraine-detector-db
    plan: free
    databaseName: migraine_detector
    user: postgres
